<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон логотипа -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2463;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e6091;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для элементов треугольника -->
    <linearGradient id="triangleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b2ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dcfb6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для соединительных линий -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7dcfb6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b2ca;stop-opacity:1" />
    </linearGradient>
    
    <!-- Свечение для эффекта коммуникаций -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Основная форма логотипа -->
  <g transform="translate(50, 50)">
    <!-- Треугольник - символ "Тринити" (троицы) -->
    <!-- Первый элемент треугольника - круг (мультимедиа) -->
    <circle cx="200" cy="50" r="30" fill="url(#triangleGradient)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    
    <!-- Второй элемент треугольника - квадрат (стабильность и надежность) -->
    <rect x="130" y="130" width="60" height="60" fill="url(#triangleGradient)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    
    <!-- Третий элемент треугольника - шестиугольник (сеть, соединение) -->
    <polygon points="270,130 300,160 270,190 240,190 210,160 240,130" 
           fill="url(#triangleGradient)" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    
    <!-- Соединительные линии, символизирующие IP-коммуникации -->
    <line x1="200" y1="80" x2="170" y2="130" stroke="url(#lineGradient)" stroke-width="3" stroke-dasharray="5,3" />
    <line x1="190" y1="160" x2="210" y2="160" stroke="url(#lineGradient)" stroke-width="3" stroke-dasharray="5,3" />
    <line x1="230" y1="130" x2="200" y2="80" stroke="url(#lineGradient)" stroke-width="3" stroke-dasharray="5,3" />
    
    <!-- Анимированные точки, имитирующие передачу данных -->
    <circle cx="200" cy="80" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="130" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="190" cy="160" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="160" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="230" cy="130" r="5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Название компании -->
  <text x="250" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">ТРИНИТИ</text>
  
  <!-- Слоган -->
  <text x="250" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#7dcfb6">мультимедийные IP-коммуникации</text>
  
  <!-- Декоративные элементы -->
  <path d="M100,220 Q250,200 400,220" stroke="#00b2ca" stroke-width="1" fill="none" />
  
  <!-- Цифровой подзнак (имитация IP-протокола) -->
  <g transform="translate(390, 70) scale(0.4)">
    <text font-family="Courier New, monospace" font-size="14" fill="#7dcfb6">192.168.1.1</text>
  </g>
</svg>
